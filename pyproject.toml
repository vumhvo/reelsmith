[project]
name = "reelsmith"
version = "0.1.0"
description = "Video editing toolkit driven by Claude: analysis, JSON edit decision lists, ffmpeg rendering."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
]

[project.optional-dependencies]
# Transcription runs through `uvx --from mlx-whisper` by default, so this extra is optional.
transcribe = ["mlx-whisper>=0.4"]

[project.scripts]
cstudio = "studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]
